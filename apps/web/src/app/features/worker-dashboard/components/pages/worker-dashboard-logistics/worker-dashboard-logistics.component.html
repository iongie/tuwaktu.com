<div class="flex flex-col w-full gap-8">
  <!-- Header Section with Telemetry & Active Policy Quick Badge & Sync Action Button -->
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 pb-2">
    <div class="flex flex-col gap-2 max-w-2xl">
      <div class="flex items-center gap-2 text-micro-uppercase font-micro-uppercase text-ink-secondary tracking-widest uppercase">
        <span class="inline-block w-2 h-2 rounded-full bg-voltage-orange animate-pulse"></span>
        <span>Perlindungan Mobilitas • Presisi Geografis</span>
      </div>
      <h1 class="font-heading-1 text-heading-1 text-primary font-bold tracking-tight">
        Logistik, Basecamp &amp; Radius Layanan
      </h1>
      <p class="font-body-default text-body-default text-on-surface-variant leading-relaxed">
        Kalkulasi ongkos bensin dan pembatasan jarak fisik agar stamina kerja terjaga tanpa tawar-menawar manual di depan pintu klien.
      </p>
    </div>

    <!-- Right Controls: Mode Transportasi & Header Sync Action Button -->
    <div class="flex items-center gap-3 shrink-0 flex-wrap">
      <div class="flex items-center gap-3 bg-surface-container-lowest p-2.5 px-3.5 rounded-xl border border-hairline-subtle shadow-xs shrink-0">
        <div class="w-9 h-9 rounded-lg bg-surface-highlight flex items-center justify-center text-primary shrink-0">
          <span class="material-symbols-outlined text-[20px]">two_wheeler</span>
        </div>
        <div class="flex flex-col">
          <span class="font-caption text-caption text-ink-secondary">Mode Transportasi</span>
          <span class="font-body-strong text-body-strong text-primary">Roda Dua (Motoris Mandiri)</span>
        </div>
      </div>

      <button
        id="btn-header-sync-logistics"
        type="button"
        (click)="submitLocation()"
        [disabled]="store.isLocationSubmitting()"
        class="h-11 px-5 rounded-lg bg-primary hover:bg-neutral-800 text-on-primary font-button-label text-button-label transition-colors flex items-center gap-2 shadow-xs cursor-pointer min-h-[44px]"
      >
        @if (store.isLocationSubmitting()) {
          <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span>Menyinkronkan...</span>
        } @else if (isSavedSuccess()) {
          <span class="material-symbols-outlined text-[18px] text-whatsapp-surface">check</span>
          <span>Tersimpan &amp; Aktif</span>
        } @else {
          <span class="material-symbols-outlined text-[18px]">cloud_sync</span>
          <span>Sinkronkan Parameter</span>
        }
      </button>
    </div>
  </div>

  <!-- Main Bento Grid Layout (7 Cols Left / 5 Cols Right) -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <!-- LEFT COLUMN: Logistics Infrastructure & Controls (7 Cols) -->
    <div class="lg:col-span-7 flex flex-col gap-6">
      <!-- Basecamp Master Panel Organism -->
      <app-worker-basecamp-map-panel
        [latitude]="store.workerLat()"
        [longitude]="store.workerLng()"
        [freeRadiusKm]="store.workerFreeRadiusKm()"
        [maxRadiusKm]="store.workerMaxRadiusKm()"
        [address]="store.workerBasecampAddress()"
        [zone]="store.workerProfessionZone() || 'Tebet'"
        (coordinatesChange)="onCoordinatesChanged($event)"
        (addressChange)="onAddressChanged($event)"
      />

      <!-- Parameter Rules & Sliders Organism -->
      <app-worker-logistics-config-panel
        [freeRadiusKm]="store.workerFreeRadiusKm()"
        [extraFeePerKm]="store.workerExtraFeePerKm()"
        [maxRadiusKm]="store.workerMaxRadiusKm()"
        [basecampZone]="store.workerProfessionZone() || 'Tebet'"
        (freeRadiusKmChange)="onFreeRadiusChange($event)"
        (extraFeePerKmChange)="onExtraFeeChange($event)"
        (maxRadiusKmChange)="onMaxRadiusChange($event)"
      />
    </div>

    <!-- RIGHT COLUMN: Interactive Visualizer & Transit Simulator (5 Cols) -->
    <div class="lg:col-span-5 flex flex-col gap-6">
      <!-- Spectrum Bar Card Molecule -->
      <app-logistics-zone-spectrum-meter
        [freeRadiusKm]="store.workerFreeRadiusKm()"
        [maxRadiusKm]="store.workerMaxRadiusKm()"
        [extraFeePerKm]="store.workerExtraFeePerKm()"
        [basecampZone]="store.workerProfessionZone() || 'Tebet'"
      />

      <!-- Live Simulator Terminal Sandbox Molecule -->
      <app-logistics-simulator-terminal
        [freeRadiusKm]="store.workerFreeRadiusKm()"
        [maxRadiusKm]="store.workerMaxRadiusKm()"
        [extraFeePerKm]="store.workerExtraFeePerKm()"
        [basecampZone]="store.workerProfessionZone() || 'Tebet'"
      />

      <!-- Physical Protection Manifesto Card Molecule -->
      <app-logistics-manifesto-card
        [maxRadiusKm]="store.workerMaxRadiusKm()"
      />
    </div>
  </div>
</div>
