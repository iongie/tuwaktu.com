<div class="flex flex-col w-full space-y-6">
  <!-- Top Meta & Title Banner -->
  <header class="flex flex-col gap-3">
    <div
      class="flex items-center gap-2 text-micro-uppercase font-micro-uppercase text-ink-secondary tracking-widest uppercase"
    >
      <span>Protokol Jalur Langsung</span>
      <span class="w-1.5 h-1.5 rounded-full bg-whatsapp-green"></span>
      <span class="text-whatsapp-green font-semibold">Zero Middleman Architecture</span>
    </div>

    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div class="max-w-3xl">
        <h1 class="font-heading-1 text-heading-1 text-ink-on-light tracking-tight">
          Integrasi Pesan Masuk WhatsApp
        </h1>
        <p class="font-lead-body text-lead-body text-on-surface-variant mt-1 font-normal">
          Mengingat Tuwaktu menggunakan model direct chat tanpa in-app chat berbelit, semua pesanan dari profil publik akan dirangkum rapi dan diteruskan langsung ke WhatsApp Anda.
        </p>
      </div>

      <div class="flex items-center gap-3 self-start md:self-auto shrink-0">
        <button
          type="button"
          id="btn-reset-default"
          (click)="resetDefault()"
          class="px-4 py-2 bg-surface-highlight hover:bg-surface-variant text-ink-on-light rounded transition-colors font-button-label text-button-label flex items-center gap-1.5 min-h-[44px] cursor-pointer"
        >
          <span class="material-symbols-outlined text-[18px]">restart_alt</span>
          <span>Reset Default</span>
        </button>

        <button
          type="button"
          id="btn-test-send"
          (click)="testSendWhatsApp()"
          class="px-5 py-2 bg-whatsapp-green hover:bg-whatsapp-green-hover text-on-primary rounded transition-colors font-button-label text-button-label flex items-center gap-1.5 shadow-xs min-h-[44px] cursor-pointer font-semibold"
        >
          <span class="material-symbols-outlined text-[18px]">send</span>
          <span>Uji Kirim WhatsApp</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main 12-Column Responsive Workspace -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <!-- Left Column: Settings, Variables & Template Config (7 Cols) -->
    <div class="lg:col-span-7 flex flex-col gap-6">
      <!-- Panel 1: Worker Phone Number Configuration Organism -->
      <app-worker-whatsapp-config-panel />

      <!-- Panel 2: Message Template Engine & Variable Insertion Organism -->
      <app-worker-whatsapp-template-panel />

      <!-- Panel 3: Sovereign Workflow Best Practices / Tips Molecule -->
      <app-whatsapp-billing-guide />
    </div>

    <!-- Right Column: Live WhatsApp Bubble Mockup Organism (5 Cols Sticky) -->
    <div class="lg:col-span-5 flex flex-col gap-6">
      <app-worker-whatsapp-preview-mockup />
    </div>
  </div>
</div>
